<svg style="font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 788.544" width="640" height="788.544" role="img" aria-label="Van een activiteit naar een bezoekbare mogelijkheid: de zoekladder en de controles" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C857A"/></marker>
<marker id="ah-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8C857A"/></marker>
</defs><rect x="6" y="6" width="292" height="40" rx="6" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="152" y="22.0" font-size="11.5" font-weight="700" fill="#33221A" text-anchor="middle">Ontdekken</text>
<text x="152" y="37.0" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="middle">motor, bibliotheek, geen AI, gratis</text>
<rect x="342" y="6" width="292" height="40" rx="6" fill="#EEE2F1" stroke="#7A4E7E" stroke-width="1.2"/>
<text x="488" y="22.0" font-size="11.5" font-weight="700" fill="#3E2144" text-anchor="middle">Concreet maken</text>
<text x="488" y="37.0" font-size="9.4" font-weight="400" fill="#3E2144" text-anchor="middle">zoeken op het web, AI, websitecheck</text>
<path d="M298 26 L342 26" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="320" y="18.0" font-size="8.6" font-weight="400" fill="#6A655D" text-anchor="middle" font-style="italic">grens</text>
<rect x="6" y="62" width="392" height="54.976" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="14" y="79.2" font-size="10.2" font-weight="700" fill="#33221A" text-anchor="start">Het zaad</text>
<text x="14" y="95.2" font-size="9.2" font-weight="400" fill="#33221A" text-anchor="start">Een activiteit met richting en deur, gekozen door de motor. Hier eindigt</text>
<text x="14" y="107.2" font-size="9.2" font-weight="400" fill="#33221A" text-anchor="start">het ontdekken: het is nog een idee, geen adres.</text>
<path d="M202 116.976 L202 134.976" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="6" y="134.976" width="392" height="66.93599999999999" rx="7" fill="#E1EAF2" stroke="#3E5C76" stroke-width="1.2"/>
<text x="14" y="152.2" font-size="10.2" font-weight="700" fill="#1F3447" text-anchor="start">0 Cache</text>
<text x="14" y="168.2" font-size="9.2" font-weight="400" fill="#1F3447" text-anchor="start">Per activiteit, plaats, afstand en maand. Gevonden opties tellen 30</text>
<text x="14" y="180.2" font-size="9.2" font-weight="400" fill="#1F3447" text-anchor="start">dagen, 'niets gevonden' 7 dagen, 'niets' voor een eigen keuze 2 dagen.</text>
<text x="14" y="192.1" font-size="9.2" font-weight="400" fill="#1F3447" text-anchor="start">Wat een einddatum heeft, vervalt daarmee.</text>
<path d="M202 201.91199999999998 L202 219.91199999999998" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="258" y="213.9" font-size="9.5" font-weight="400" fill="#6A655D" text-anchor="middle" font-style="italic">niet in de cache</text>
<rect x="6" y="219.91199999999998" width="392" height="66.93599999999999" rx="7" fill="#EEE2F1" stroke="#7A4E7E" stroke-width="1.2"/>
<text x="14" y="237.1" font-size="10.2" font-weight="700" fill="#3E2144" text-anchor="start">1 Standaardronde</text>
<text x="14" y="253.1" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">Haiku 4.5 met webzoeken. Hoogstens 5 zoekopdrachten voor de ideeën samen,</text>
<text x="14" y="265.1" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">hoogstens 4 voor je eigen keuzes (apart). Alleen fysieke plekken:</text>
<text x="14" y="277.1" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">werkplaats, club, bezoekplek.</text>
<path d="M202 286.84799999999996 L202 304.84799999999996" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="258" y="298.8" font-size="9.5" font-weight="400" fill="#6A655D" text-anchor="middle" font-style="italic">niets gevonden</text>
<rect x="6" y="304.84799999999996" width="392" height="66.93599999999999" rx="7" fill="#EEE2F1" stroke="#7A4E7E" stroke-width="1.2"/>
<text x="14" y="322.0" font-size="10.2" font-weight="700" fill="#3E2144" text-anchor="start">2 Brede ronde</text>
<text x="14" y="338.1" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">Clubs, buurthuizen, bibliotheken, repair cafés, musea, boerderijen. Over</text>
<text x="14" y="350.0" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">twee keer de gekozen afstand (hoogstens 150 km), nabijste eerst,</text>
<text x="14" y="362.0" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">hoogstens 4 zoekopdrachten.</text>
<path d="M202 371.78399999999993 L202 389.78399999999993" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="258" y="383.8" font-size="9.5" font-weight="400" fill="#6A655D" text-anchor="middle" font-style="italic">nog niets</text>
<rect x="6" y="389.78399999999993" width="392" height="54.976" rx="7" fill="#EEE2F1" stroke="#7A4E7E" stroke-width="1.2"/>
<text x="14" y="407.0" font-size="10.2" font-weight="700" fill="#3E2144" text-anchor="start">3 Online, alleen als het van nature online is</text>
<text x="14" y="423.0" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">Een schrijfcursus of taalapp heeft geen plek nodig en gaat meteen naar</text>
<text x="14" y="435.0" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">aanbieders van thuis uit.</text>
<path d="M202 444.75999999999993 L202 462.75999999999993" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="258" y="456.8" font-size="9.5" font-weight="400" fill="#6A655D" text-anchor="middle" font-style="italic">nog niets</text>
<rect x="6" y="462.75999999999993" width="392" height="78.89599999999999" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="14" y="479.9" font-size="10.2" font-weight="700" fill="#33221A" text-anchor="start">4 Vervangen</text>
<text x="14" y="496.0" font-size="9.2" font-weight="400" fill="#33221A" text-anchor="start">De motor kiest een ander idee (twee rondes; de laatste alleen</text>
<text x="14" y="508.0" font-size="9.2" font-weight="400" fill="#33221A" text-anchor="start">activiteiten die geen aanbieder nodig hebben). Een eigen keuze zonder</text>
<text x="14" y="519.9" font-size="9.2" font-weight="400" fill="#33221A" text-anchor="start">aanbod wordt een verwant idee uit de graaf, en het boek zegt dat in één</text>
<text x="14" y="531.9" font-size="9.2" font-weight="400" fill="#33221A" text-anchor="start">zin.</text>
<path d="M202 541.656 L202 559.656" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="258" y="553.7" font-size="9.5" font-weight="400" fill="#6A655D" text-anchor="middle" font-style="italic">nog niets</text>
<rect x="6" y="559.656" width="392" height="54.976" rx="7" fill="#EEE2F1" stroke="#7A4E7E" stroke-width="1.2"/>
<text x="14" y="576.8" font-size="10.2" font-weight="700" fill="#3E2144" text-anchor="start">5 Online als laatste redmiddel</text>
<text x="14" y="592.9" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">Pas nu: een cursus, webshop met pakket of landelijke vereniging met</text>
<text x="14" y="604.9" font-size="9.2" font-weight="400" fill="#3E2144" text-anchor="start">website. Fysiek gaat altijd voor.</text>
<path d="M202 614.632 L202 632.632" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<text x="258" y="626.6" font-size="9.5" font-weight="400" fill="#6A655D" text-anchor="middle" font-style="italic">nog niets</text>
<rect x="6" y="632.632" width="392" height="66.93599999999999" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="14" y="649.8" font-size="10.2" font-weight="700" fill="#33221A" text-anchor="start">6 Verwisselen</text>
<text x="14" y="665.9" font-size="9.2" font-weight="400" fill="#33221A" text-anchor="start">Een idee dat nog steeds niets heeft, wordt geruild met een idee dat</text>
<text x="14" y="677.8" font-size="9.2" font-weight="400" fill="#33221A" text-anchor="start">eerder in dezelfde run wel een optie vond. Zo komt er nooit een idee</text>
<text x="14" y="689.8" font-size="9.2" font-weight="400" fill="#33221A" text-anchor="start">zonder optie in het boek.</text>
<path d="M202 699.568 L202 721.568" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="6" y="721.568" width="392" height="54.976" rx="7" fill="#E1EAF2" stroke="#3E5C76" stroke-width="1.2"/>
<text x="14" y="738.7" font-size="10.2" font-weight="700" fill="#1F3447" text-anchor="start">Bezoek in het boek</text>
<text x="14" y="754.8" font-size="9.2" font-weight="400" fill="#1F3447" text-anchor="start">Naam, plaats, link, korte notitie, eventueel een beoordeling, kaartlink</text>
<text x="14" y="766.8" font-size="9.2" font-weight="400" fill="#1F3447" text-anchor="start">en een eerste stap die je binnen een minuut kunt doen.</text>
<rect x="424" y="62" width="210" height="205.58" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="432" y="79.0" font-size="10" font-weight="700" fill="#33221A" text-anchor="start">Wat er met elke gevonden optie</text>
<text x="432" y="91.8" font-size="10" font-weight="700" fill="#33221A" text-anchor="start">gebeurt</text>
<text x="432" y="107.6" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">Alleen een plek met echte plaatsnaam</text>
<text x="432" y="119.2" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">telt; 'Online' of alleen het land niet.</text>
<text x="432" y="130.7" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">De website wordt gelezen (max 150 KB).</text>
<text x="432" y="142.3" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">Er valt af: een host die niet bestaat,</text>
<text x="432" y="153.9" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">een pagina die zegt 'definitief</text>
<text x="432" y="165.4" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">gesloten', een geparkeerd of te koop</text>
<text x="432" y="177.0" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">staand domein, of een site waar de naam</text>
<text x="432" y="188.6" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">niet op voorkomt.</text>
<text x="432" y="200.2" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">Een verdwenen pagina op een bestaande</text>
<text x="432" y="211.7" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">site wordt de voorpagina. Een time-out,</text>
<text x="432" y="223.3" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">403 of 429 telt niet als bewijs van het</text>
<text x="432" y="234.9" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">tegendeel.</text>
<text x="432" y="246.4" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">Een optie met einddatum in het verleden</text>
<text x="432" y="258.0" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">valt af.</text>
<rect x="424" y="279.58000000000004" width="210" height="123.36" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="432" y="296.6" font-size="10" font-weight="700" fill="#33221A" text-anchor="start">Volgorde en uniciteit</text>
<text x="432" y="312.4" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">Rangorde op beoordeling, alleen als een</text>
<text x="432" y="324.0" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">zoekresultaat die liet zien.</text>
<text x="432" y="335.5" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">Gecorrigeerd: (score × n + 4,0 × 20) /</text>
<text x="432" y="347.1" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">(n + 20); onder 4,0 alleen als er niets</text>
<text x="432" y="358.7" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">beters is. Hoogstens 3 per idee.</text>
<text x="432" y="370.2" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">Eén plek, één idee: een plek die een</text>
<text x="432" y="381.8" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">eerder idee al heeft, valt bij een</text>
<text x="432" y="393.4" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">later idee af.</text>
<rect x="424" y="414.94000000000005" width="210" height="100.22" rx="7" fill="#E2EEE0" stroke="#5E8A5B" stroke-width="1.2"/>
<text x="432" y="431.9" font-size="10" font-weight="700" fill="#27431F" text-anchor="start">Wat niet wordt gecontroleerd</text>
<text x="432" y="447.7" font-size="8.9" font-weight="400" fill="#27431F" text-anchor="start">Openingstijden, prijzen en adressen</text>
<text x="432" y="459.3" font-size="8.9" font-weight="400" fill="#27431F" text-anchor="start">worden niet tegen een gestructureerde</text>
<text x="432" y="470.9" font-size="8.9" font-weight="400" fill="#27431F" text-anchor="start">bron gehaald. Het boek belooft dus geen</text>
<text x="432" y="482.5" font-size="8.9" font-weight="400" fill="#27431F" text-anchor="start">'geverifieerde' plekken, alleen plekken</text>
<text x="432" y="494.0" font-size="8.9" font-weight="400" fill="#27431F" text-anchor="start">waarvan de website bestaat en niet zegt</text>
<text x="432" y="505.6" font-size="8.9" font-weight="400" fill="#27431F" text-anchor="start">gesloten te zijn.</text></svg>