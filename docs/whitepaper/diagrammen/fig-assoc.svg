<svg style="font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 523.616" width="640" height="523.616" role="img" aria-label="Associatiemodel: van beeldkaarten en tags naar de pagina met concrete activiteiten" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C857A"/></marker>
<marker id="ah-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8C857A"/></marker>
</defs><rect x="6" y="8" width="196" height="137.78199999999998" rx="7" fill="#E1EAF2" stroke="#3E5C76" stroke-width="1.2"/>
<text x="14" y="25.4" font-size="10.4" font-weight="700" fill="#1F3447" text-anchor="start">516 beeldkaarten</text>
<text x="14" y="41.7" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">172 families van 3 varianten.</text>
<text x="14" y="53.5" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">Rondes: plekken 177, momenten 174,</text>
<text x="14" y="65.3" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">zintuigen 165.</text>
<text x="14" y="77.2" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">Per kaart: 2 tot 5 gewogen tags</text>
<text x="14" y="89.0" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">(uit 43), vier assen van -1 tot 1</text>
<text x="14" y="100.8" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">(sociaal, energie, binnen of</text>
<text x="14" y="112.7" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">buiten, vertrouwd of nieuw) en een</text>
<text x="14" y="124.5" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">stijlregister dat de bezoeker nooit</text>
<text x="14" y="136.3" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">ziet.</text>
<rect x="436" y="8" width="198" height="125.952" rx="7" fill="#E1EAF2" stroke="#3E5C76" stroke-width="1.2"/>
<text x="444" y="25.4" font-size="10.4" font-weight="700" fill="#1F3447" text-anchor="start">756 activiteiten</text>
<text x="444" y="41.7" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">22 werelden, 68 subdomeinen.</text>
<text x="444" y="53.5" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">Gemiddeld 3,6 tags per activiteit</text>
<text x="444" y="65.3" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">(43 tags, 7 'generiek': een sfeer,</text>
<text x="444" y="77.2" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">geen verband).</text>
<text x="444" y="89.0" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">Ook per activiteit: sociale vormen,</text>
<text x="444" y="100.8" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">intensiteit, niveau, kosten, duur,</text>
<text x="444" y="112.7" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">binnen of buiten, seizoen, toezicht,</text>
<text x="444" y="124.5" font-size="9.1" font-weight="400" fill="#1F3447" text-anchor="start">aanbod.</text>
<rect x="6" y="169.78199999999998" width="196" height="54.724000000000004" rx="7" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="186.6" font-size="9.8" font-weight="700" fill="#4A3611" text-anchor="start">Je tikt 3 tot 8 beelden</text>
<text x="14" y="202.1" font-size="9.3" font-weight="400" fill="#4A3611" text-anchor="start">Een set van 18 per keer; maximaal</text>
<text x="14" y="214.2" font-size="9.3" font-weight="400" fill="#4A3611" text-anchor="start">5 per ronde telt mee.</text>
<path d="M104 145.78199999999998 L104 169.78199999999998" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="228" y="169.78199999999998" width="188" height="90.462" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="236" y="187.1" font-size="10.4" font-weight="700" fill="#33221A" text-anchor="start">Smaakprofiel</text>
<text x="236" y="203.5" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">Tag-profiel = som van de</text>
<text x="236" y="215.3" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">tagwaarden van je beelden, plus</text>
<text x="236" y="227.1" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">2,5 per thema bij 'Niet helemaal'.</text>
<text x="236" y="238.9" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">Assen = gemiddelde van je beelden,</text>
<text x="236" y="250.8" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">tenzij je een schuif verzet.</text>
<path d="M202 197.14399999999998 L228 197.14399999999998" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="228" y="282.24399999999997" width="188" height="102.292" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="236" y="299.6" font-size="10.4" font-weight="700" fill="#33221A" text-anchor="start">Twee afgeleide dials</text>
<text x="236" y="315.9" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">Nieuwheid-as: 'praktisch tot wild'</text>
<text x="236" y="327.7" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">(5 klassen).</text>
<text x="236" y="339.6" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">Energie-as: inspanning (3</text>
<text x="236" y="351.4" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">klassen).</text>
<text x="236" y="363.2" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">Ze sturen de harde filters:</text>
<text x="236" y="375.1" font-size="9.1" font-weight="400" fill="#33221A" text-anchor="start">toezicht en intensiteit.</text>
<path d="M322 260.24399999999997 L322 282.24399999999997" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="436" y="169.78199999999998" width="198" height="112.302" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="444" y="187.1" font-size="10.4" font-weight="700" fill="#33221A" text-anchor="start">Pagina 2: 18 activiteiten</text>
<text x="444" y="203.5" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">score = nabijheid / max + 0,25</text>
<text x="444" y="215.0" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">aspassing + 0,3 context + 0,5 toeval</text>
<text x="444" y="226.6" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">(seeded)</text>
<text x="444" y="238.2" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">nabijheid = Σ profiel[tag] (generiek</text>
<text x="444" y="249.7" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">×0,5) / √aantal tags</text>
<text x="444" y="261.3" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">Vloer: elk register minstens 2; 3</text>
<text x="444" y="272.9" font-size="8.9" font-weight="400" fill="#33221A" text-anchor="start">verkenplekken van ver.</text>
<path d="M535 133.952 L535 169.78199999999998" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<path d="M416 215.01299999999998 L436 215.01299999999998" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="436" y="304.084" width="198" height="54.724000000000004" rx="7" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="444" y="320.9" font-size="9.8" font-weight="700" fill="#4A3611" text-anchor="start">Je kiest 1 tot 8</text>
<text x="444" y="336.4" font-size="9.3" font-weight="400" fill="#4A3611" text-anchor="start">Of: verras me. Dit zijn jouw eigen</text>
<text x="444" y="348.5" font-size="9.3" font-weight="400" fill="#4A3611" text-anchor="start">keuzes.</text>
<path d="M535 282.084 L535 304.084" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="228" y="410.53599999999994" width="406" height="67.58200000000001" rx="7" fill="#E1EAF2" stroke="#3E5C76" stroke-width="1.2"/>
<text x="236" y="427.9" font-size="10.4" font-weight="700" fill="#1F3447" text-anchor="start">Wat de motor krijgt</text>
<text x="236" y="444.2" font-size="9.3" font-weight="400" fill="#1F3447" text-anchor="start">Ankers: je eigen activiteiten (tot 4 komen zeker in het boek). Dials en</text>
<text x="236" y="456.3" font-size="9.3" font-weight="400" fill="#1F3447" text-anchor="start">filters bepalen wat de motor mag voorstellen. Tag-profiel en assen komen</text>
<text x="236" y="468.4" font-size="9.3" font-weight="400" fill="#1F3447" text-anchor="start">terug in de profielduiding en in 'Omdat je … koos'.</text>
<path d="M322 384.53599999999994 L322 410.53599999999994" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<path d="M535 358.808 L535 410.53599999999994" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="6" y="410.53599999999994" width="206" height="77.08" rx="7" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="14" y="427.5" font-size="10" font-weight="700" fill="#202020" text-anchor="start">Associatielaag (staat uit)</text>
<text x="14" y="443.3" font-size="8.9" font-weight="400" fill="#202020" text-anchor="start">127 associaties zoals geur, trots of</text>
<text x="14" y="454.9" font-size="8.9" font-weight="400" fill="#202020" text-anchor="start">vrijheid zouden pagina 2 verfijnen</text>
<text x="14" y="466.5" font-size="8.9" font-weight="400" fill="#202020" text-anchor="start">(gewicht 0,35). Gebouwd en gemeten,</text>
<text x="14" y="478.0" font-size="8.9" font-weight="400" fill="#202020" text-anchor="start">niet aangezet.</text>
<path d="M212 444.32699999999994 L228 444.32699999999994" fill="none" stroke="#8C857A" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="8" y="501.61599999999993" width="13" height="13" rx="3" fill="#E1EAF2" stroke="#3E5C76" stroke-width="1.2"/>
<text x="27" y="512.1" font-size="9.6" font-weight="400" fill="#6A655D" text-anchor="start">Data</text>
<rect x="64.312" y="501.61599999999993" width="13" height="13" rx="3" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="83.312" y="512.1" font-size="9.6" font-weight="400" fill="#6A655D" text-anchor="start">Eigen code</text>
<rect x="152.59199999999998" y="501.61599999999993" width="13" height="13" rx="3" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="171.59199999999998" y="512.1" font-size="9.6" font-weight="400" fill="#6A655D" text-anchor="start">Bezoeker</text></svg>