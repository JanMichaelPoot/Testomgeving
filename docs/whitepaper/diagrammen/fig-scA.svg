<text x="14" y="150.4" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Helemaal stil worden</text>
<rect x="6" y="161.20000000000002" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="173.2" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Kaarslicht</text>
<rect x="6" y="184.00000000000003" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="196.0" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Een stille bosrand</text>
<text x="219" y="62.0" font-size="9.6" font-weight="700" fill="#33221A" text-anchor="start">2  Wat de code uit de beelden leest</text>
<rect x="219" y="70" width="202" height="29.6" rx="5" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
