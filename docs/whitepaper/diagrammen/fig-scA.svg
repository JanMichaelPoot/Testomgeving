<text x="227" y="182.8" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Harde grenzen: kosten t/m klasse 2,</text>
<text x="227" y="193.6" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">intensiteit t/m 1</text>
<text x="432" y="62.0" font-size="9.6" font-weight="700" fill="#4A3611" text-anchor="start">3  Activiteiten die zij kiest</text>
