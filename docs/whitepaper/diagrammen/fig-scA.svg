<text x="6" y="548.8" font-size="9" font-weight="400" fill="#6A655D" text-anchor="start">Het zoeken naar aanbieders is hier niet gedraaid: het gebruikt betaalde AI en webzoekopdrachten. Zie hoofdstuk 8 voor een</text>
