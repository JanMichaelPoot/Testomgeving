<text x="227" y="115.6" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Assen: sociaal −0,53, energie −0,68,</text>
<text x="227" y="126.4" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">binnen/buiten −0,17, nieuw −0,13</text>
