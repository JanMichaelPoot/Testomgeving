<text x="104.624" y="651.4" font-size="9.6" font-weight="400" fill="#6A655D" text-anchor="start">Eigen code</text>
<rect x="173.904" y="640.9" width="13" height="13" rx="3" fill="#E1EAF2" stroke="#3E5C76" stroke-width="1.2"/>
<text x="192.904" y="651.4" font-size="9.6" font-weight="400" fill="#6A655D" text-anchor="start">Opslag</text>
<rect x="240.872" y="640.9" width="13" height="13" rx="3" fill="#EEE2F1" stroke="#7A4E7E" stroke-width="1.2"/>
<text x="259.872" y="651.4" font-size="9.6" font-weight="400" fill="#6A655D" text-anchor="start">AI</text>
<rect x="286.528" y="640.9" width="13" height="13" rx="3" fill="#E2EEE0" stroke="#5E8A5B" stroke-width="1.2"/>
<text x="305.528" y="651.4" font-size="9.6" font-weight="400" fill="#6A655D" text-anchor="start">Extern</text></svg>