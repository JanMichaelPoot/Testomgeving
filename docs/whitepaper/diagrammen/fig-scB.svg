<text x="14" y="316.6" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Vertrouwd</text>
<text x="128" y="302.6" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Naaicafé</text>
<text x="128" y="315.6" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Je eigen keuze (anker).</text>
<rect x="6" y="329.6" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="329.6" width="112" height="40" rx="6" fill="#F3E1AE" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="346.6" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">1 Vertrouwd</text>
<text x="14" y="360.6" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Vertrouwd</text>
<text x="128" y="346.6" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Langs de Romeinse limes</text>
<text x="128" y="359.6" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Je eigen keuze (anker).</text>
<rect x="6" y="373.6" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="373.6" width="112" height="40" rx="6" fill="#F3E1AE" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="390.6" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">1 Vertrouwd</text>
<text x="14" y="404.6" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Vertrouwd</text>
<text x="128" y="390.6" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Lasergamen of paintball</text>
<text x="128" y="403.6" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Je eigen keuze (anker).</text>
<rect x="6" y="417.6" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="417.6" width="112" height="40" rx="6" fill="#E0BC85" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="434.6" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">3 Verwant</text>
<text x="14" y="448.6" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Ontdekking</text>
<text x="128" y="434.6" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Oriëntatielopen</text>
<text x="128" y="447.6" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Verbonden met 'Lasergamen of paintball' via Competitie en Beweging. Aansluiting 0,28.</text>
<rect x="6" y="461.6" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="461.6" width="112" height="40" rx="6" fill="#B9AEA2" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="478.6" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">5 Verrassend</text>
<text x="14" y="492.6" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Onverwacht</text>
<text x="128" y="478.6" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Parfumerie bezoeken en geuren leren herkennen</text>
<text x="128" y="491.6" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Keten: Naaicafé → Natuurlijke cosmetica maken → Parfumerie bezoeken en geuren leren herkennen.</text>
<text x="128" y="501.6" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Verband: Stijl.</text>
<rect x="6" y="505.6" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="505.6" width="112" height="40" rx="6" fill="#8FA0B6" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="522.6" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">7 Onontdekt</text>
<text x="14" y="536.6" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Wildcard</text>
<text x="128" y="522.6" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Kaarsen maken</text>
<text x="128" y="535.6" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Toevalsprikkel uit een wereld die je niet koos, losjes verbonden met 'Naaicafé' (Vakmanschap).</text>
<text x="6" y="559.6" font-size="9" font-weight="400" fill="#6A655D" text-anchor="start">Het zoeken naar aanbieders is hier niet gedraaid: het gebruikt betaalde AI en webzoekopdrachten. Zie hoofdstuk 8 voor een</text>
<text x="6" y="570.6" font-size="9" font-weight="400" fill="#6A655D" text-anchor="start">echt resultaat.</text></svg>