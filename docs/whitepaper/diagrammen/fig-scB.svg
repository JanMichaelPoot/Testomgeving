<svg style="font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 579.6" width="640" height="579.6" role="img" aria-label="Praktijkvoorbeeld B: Ouder zoekt voor Sam (kind, Utrecht)" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C857A"/></marker>
<marker id="ah-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8C857A"/></marker>
</defs><rect x="6" y="6" width="628" height="44" rx="8" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2"/>
<text x="16" y="24.0" font-size="12" font-weight="700" fill="#5B3F2F" text-anchor="start">Ouder zoekt voor Sam (kind, Utrecht)</text>
<text x="16" y="40.0" font-size="9.4" font-weight="400" fill="#6A655D" text-anchor="start">Zoekt voor een kind of jongere in Utrecht, binnen 15 km, budget tot € 25 per persoon, november.</text>
<text x="624" y="24.0" font-size="9" font-weight="700" fill="#B08A4A" text-anchor="end">Fictief profiel, echte motor-uitvoer</text>
<text x="6" y="62.0" font-size="9.6" font-weight="700" fill="#4A3611" text-anchor="start">1  Beelden die zij tikt</text>
<rect x="6" y="70" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="82.0" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Samen hard lachen</text>
<rect x="6" y="92.8" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="104.8" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Een stal met warm stro</text>
<rect x="6" y="115.6" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="127.6" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Handen vol klei</text>
<rect x="6" y="138.4" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="150.4" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Wind in je gezicht</text>
<rect x="6" y="161.20000000000002" width="202" height="29.6" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="173.2" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Een makerslab met een 3D-printer en</text>
<text x="14" y="184.0" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">soldeerbout</text>
<rect x="6" y="194.8" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="206.8" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Vlak voor de start</text>
<text x="219" y="62.0" font-size="9.6" font-weight="700" fill="#33221A" text-anchor="start">2  Wat de code uit de beelden leest</text>
<rect x="219" y="70" width="202" height="40.400000000000006" rx="5" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="227" y="82.0" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Sterkste tags: Zelf maken, Beweging,</text>
<text x="227" y="92.8" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Vakmanschap, Uitdaging, Gezelligheid,</text>
<text x="227" y="103.6" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Dieren</text>
<rect x="219" y="114.4" width="202" height="29.6" rx="5" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="227" y="126.4" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Assen: sociaal 0,22, energie 0,28,</text>
<text x="227" y="137.2" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">binnen/buiten −0,03, nieuw 0,23</text>
<rect x="219" y="148" width="202" height="29.6" rx="5" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="227" y="160.0" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Afgeleide dials: open voor</text>
<text x="227" y="170.8" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">onverwacht; volle inzet</text>
<rect x="219" y="181.6" width="202" height="29.6" rx="5" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="227" y="193.6" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Harde grenzen: kosten t/m klasse 2,</text>
<text x="227" y="204.4" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">intensiteit t/m 3, kind-lijst aan</text>
<text x="432" y="62.0" font-size="9.6" font-weight="700" fill="#4A3611" text-anchor="start">3  Activiteiten die zij kiest</text>
<rect x="432" y="70" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="82.0" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Calisthenics in het park</text>
<rect x="432" y="92.8" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="104.8" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Lasergamen of paintball</text>
<rect x="432" y="115.6" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="127.6" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Plogging: joggen en afval opruimen</text>
<rect x="432" y="138.4" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="150.4" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Naaicafé</text>
<rect x="432" y="161.20000000000002" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="173.2" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Langs de Romeinse limes (verkenplek)</text>
<text x="6" y="231.6" font-size="10.6" font-weight="700" fill="#5B3F2F" text-anchor="start">4  De zeven ideeën die de motor kiest</text>
<rect x="6" y="241.60000000000002" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="241.60000000000002" width="112" height="40" rx="6" fill="#EBCF93" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="258.6" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">2 Praktisch</text>
<text x="14" y="272.6" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Vertrouwd</text>
<text x="128" y="258.6" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Calisthenics in het park</text>
<text x="128" y="271.6" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Je eigen keuze (anker).</text>
<rect x="6" y="285.6" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="285.6" width="112" height="40" rx="6" fill="#F3E1AE" stroke="#3C2920" stroke-width="1"/>
