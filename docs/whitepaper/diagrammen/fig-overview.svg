<text x="399" y="313.7" font-size="9.6" font-weight="400" fill="#3E2144" text-anchor="start">Webzoekopdrachten,</text>
<text x="399" y="326.2" font-size="9.6" font-weight="400" fill="#3E2144" text-anchor="start">websitecheck,</text>
<text x="399" y="338.6" font-size="9.6" font-weight="400" fill="#3E2144" text-anchor="start">vervanging als er</text>
<text x="399" y="351.1" font-size="9.6" font-weight="400" fill="#3E2144" text-anchor="start">niets is.</text>
