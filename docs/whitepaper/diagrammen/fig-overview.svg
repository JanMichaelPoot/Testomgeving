<text x="506" y="67.5" font-size="9.6" font-weight="400" fill="#1F3447" text-anchor="start">pagina's) en e-mail.</text>
<text x="506" y="80.0" font-size="9.6" font-weight="400" fill="#1F3447" text-anchor="start">Per idee: waarom,</text>
<text x="506" y="92.5" font-size="9.6" font-weight="400" fill="#1F3447" text-anchor="start">drie maten, echte</text>
<text x="506" y="104.9" font-size="9.6" font-weight="400" fill="#1F3447" text-anchor="start">plekken, eerste stap.</text>
<rect x="498" y="146" width="132" height="60" rx="7" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2"/>
<text x="506" y="163.1" font-size="10.1" font-weight="700" fill="#202020" text-anchor="start">€ 7,50</text>
<text x="506" y="179.0" font-size="9.6" font-weight="400" fill="#202020" text-anchor="start">per boek, eenmalig,</text>
<text x="506" y="191.5" font-size="9.6" font-weight="400" fill="#202020" text-anchor="start">geen account</text>
