<text x="18" y="39.1" font-size="10.1" font-weight="700" fill="#4A3611" text-anchor="start">1 Tik beelden aan</text>
<text x="18" y="55.0" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">18 foto's per set,</text>
<text x="18" y="67.5" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">kies er 3 tot 8:</text>
<text x="18" y="80.0" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">plekken, momenten,</text>
<text x="18" y="92.5" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">zintuigen.</text>
<rect x="10" y="118" width="132" height="108" rx="7" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="18" y="135.1" font-size="10.1" font-weight="700" fill="#4A3611" text-anchor="start">2 Kies activiteiten</text>
<text x="18" y="151.0" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">18 concrete</text>
<text x="18" y="163.5" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">activiteiten die</text>
<text x="18" y="176.0" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">volgen uit je</text>
<text x="18" y="188.5" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">beelden. Kies er 1</text>
<text x="18" y="200.9" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">tot 8, of laat ons</text>
<text x="18" y="213.4" font-size="9.6" font-weight="400" fill="#4A3611" text-anchor="start">verrassen.</text>
