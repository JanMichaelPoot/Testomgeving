<text x="145" y="326.2" font-size="9.6" font-weight="400" fill="#33221A" text-anchor="start">smaak; jouw keuzes</text>
<text x="145" y="338.6" font-size="9.6" font-weight="400" fill="#33221A" text-anchor="start">zijn de ankers.</text>
