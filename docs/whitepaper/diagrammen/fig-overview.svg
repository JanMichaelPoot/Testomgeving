<text x="272" y="338.6" font-size="9.6" font-weight="400" fill="#33221A" text-anchor="start">verbanden, zonder</text>
<text x="272" y="351.1" font-size="9.6" font-weight="400" fill="#33221A" text-anchor="start">AI.</text>
