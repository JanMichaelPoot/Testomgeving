<text x="320" y="211.0" font-size="12" font-weight="700" fill="#5B3F2F" text-anchor="middle">Zeven ideeën, van vertrouwd tot onontdekt</text>
<text x="320" y="225.0" font-size="10" font-weight="400" fill="#6A655D" text-anchor="middle">Voor de lezer: vier deuren en een verzegelde wildcard</text>
