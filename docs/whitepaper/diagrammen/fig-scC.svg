<svg style="font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 588" width="640" height="588" role="img" aria-label="Praktijkvoorbeeld C: Vriendengroep (6 pers., Eindhoven)" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C857A"/></marker>
<marker id="ah-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8C857A"/></marker>
</defs><rect x="6" y="6" width="628" height="44" rx="8" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2"/>
<text x="16" y="24.0" font-size="12" font-weight="700" fill="#5B3F2F" text-anchor="start">Vriendengroep (6 pers., Eindhoven)</text>
<text x="16" y="40.0" font-size="9.4" font-weight="400" fill="#6A655D" text-anchor="start">Zoekt voor een groep in Eindhoven, binnen 25 km, budget tot € 50 per persoon, november.</text>
<text x="624" y="24.0" font-size="9" font-weight="700" fill="#B08A4A" text-anchor="end">Fictief profiel, echte motor-uitvoer</text>
<text x="6" y="62.0" font-size="9.6" font-weight="700" fill="#4A3611" text-anchor="start">1  Beelden die zij tikt</text>
<rect x="6" y="70" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="82.0" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Een arena vol licht</text>
<rect x="6" y="92.8" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="104.8" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Het scorebord na een spannende ronde</text>
<rect x="6" y="115.6" width="202" height="29.6" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="127.6" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Een muur vol aanwijzingen met rode</text>
<text x="14" y="138.4" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">draden</text>
<rect x="6" y="149.2" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="161.2" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Samen de laatste aanwijzing vinden</text>
<rect x="6" y="172" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="184.0" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Een circuit met banden en vlaggen</text>
<rect x="6" y="194.8" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="14" y="206.8" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Dobbelstenen die over het hout rollen</text>
<text x="219" y="62.0" font-size="9.6" font-weight="700" fill="#33221A" text-anchor="start">2  Wat de code uit de beelden leest</text>
<rect x="219" y="70" width="202" height="40.400000000000006" rx="5" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="227" y="82.0" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Sterkste tags: Samenwerken, Spelen,</text>
<text x="227" y="92.8" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Spanning, Competitie, Puzzelen,</text>
<text x="227" y="103.6" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Gezelligheid</text>
<rect x="219" y="114.4" width="202" height="29.6" rx="5" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="227" y="126.4" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Assen: sociaal 0,63, energie 0,53,</text>
<text x="227" y="137.2" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">binnen/buiten −0,47, nieuw 0,33</text>
<rect x="219" y="148" width="202" height="29.6" rx="5" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="227" y="160.0" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Afgeleide dials: open voor</text>
<text x="227" y="170.8" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">onverwacht; volle inzet</text>
<rect x="219" y="181.6" width="202" height="40.400000000000006" rx="5" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="227" y="193.6" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">Harde grenzen: kosten t/m klasse 2,</text>
<text x="227" y="204.4" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">intensiteit t/m 3, alleen</text>
<text x="227" y="215.2" font-size="9" font-weight="400" fill="#33221A" text-anchor="start">groepsvormen</text>
<text x="432" y="62.0" font-size="9.6" font-weight="700" fill="#4A3611" text-anchor="start">3  Activiteiten die zij kiest</text>
<rect x="432" y="70" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="82.0" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Paintball of airsoft</text>
<rect x="432" y="92.8" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="104.8" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Handbal bij een vereniging</text>
<rect x="432" y="115.6" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="127.6" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Lasergamen of paintball</text>
<rect x="432" y="138.4" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="150.4" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Puzzeljacht (puzzle hunt)</text>
<rect x="432" y="161.20000000000002" width="202" height="18.8" rx="5" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="440" y="173.2" font-size="9" font-weight="400" fill="#4A3611" text-anchor="start">Zeep maken (verkenplek)</text>
<text x="6" y="240.0" font-size="10.6" font-weight="700" fill="#5B3F2F" text-anchor="start">4  De zeven ideeën die de motor kiest</text>
<rect x="6" y="250" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="250" width="112" height="40" rx="6" fill="#F3E1AE" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="267.0" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">1 Vertrouwd</text>
<text x="14" y="281.0" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Vertrouwd</text>
<text x="128" y="267.0" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Lasergamen of paintball</text>
<text x="128" y="280.0" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Je eigen keuze (anker).</text>
<rect x="6" y="294" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="294" width="112" height="40" rx="6" fill="#EBCF93" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="311.0" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">2 Praktisch</text>
<text x="14" y="325.0" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Vertrouwd</text>
<text x="128" y="311.0" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Zeep maken</text>
<text x="128" y="324.0" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Je eigen keuze (anker).</text>
<rect x="6" y="338" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="338" width="112" height="40" rx="6" fill="#F3E1AE" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="355.0" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">1 Vertrouwd</text>
<text x="14" y="369.0" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Vertrouwd</text>
<text x="128" y="355.0" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Paintball of airsoft</text>
<text x="128" y="368.0" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Je eigen keuze (anker).</text>
<rect x="6" y="382" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="382" width="112" height="40" rx="6" fill="#F3E1AE" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="399.0" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">1 Vertrouwd</text>
<text x="14" y="413.0" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Vertrouwd</text>
<text x="128" y="399.0" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Puzzeljacht (puzzle hunt)</text>
<text x="128" y="412.0" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Je eigen keuze (anker).</text>
<rect x="6" y="426" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="426" width="112" height="40" rx="6" fill="#E0BC85" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="443.0" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">3 Verwant</text>
<text x="14" y="457.0" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Ontdekking</text>
<text x="128" y="443.0" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">IJshockey proefles</text>
<text x="128" y="456.0" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Verbonden met 'Paintball of airsoft' via Competitie en Samenwerken. Aansluiting 0,27.</text>
<rect x="6" y="470" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="470" width="112" height="40" rx="6" fill="#B9AEA2" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="487.0" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">5 Verrassend</text>
<text x="14" y="501.0" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Onverwacht</text>
<text x="128" y="487.0" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Een eigen mini-onderzoek doen</text>
<text x="128" y="500.0" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Keten: Puzzeljacht (puzzle hunt) → Codes kraken: cryptografie voor beginners → Een eigen</text>
<text x="128" y="510.0" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">mini-onderzoek doen. Verband: Puzzelen.</text>
<rect x="6" y="514" width="628" height="40" rx="6" fill="#FFFFFF" stroke="#DED8CE" stroke-width="1.2"/>
<rect x="6" y="514" width="112" height="40" rx="6" fill="#8FA0B6" stroke="#3C2920" stroke-width="1"/>
<text x="14" y="531.0" font-size="9.6" font-weight="700" fill="#3C2920" text-anchor="start">7 Onontdekt</text>
<text x="14" y="545.0" font-size="8.8" font-weight="400" fill="#4A3B30" text-anchor="start">Wildcard</text>
<text x="128" y="531.0" font-size="10.4" font-weight="700" fill="#202020" text-anchor="start">Modelbouw (plastic, schepen, vliegtuigen)</text>
<text x="128" y="544.0" font-size="8.8" font-weight="400" fill="#6A655D" text-anchor="start">Toevalsprikkel uit een wereld die je niet koos.</text>
<text x="6" y="568.0" font-size="9" font-weight="400" fill="#6A655D" text-anchor="start">Het zoeken naar aanbieders is hier niet gedraaid: het gebruikt betaalde AI en webzoekopdrachten. Zie hoofdstuk 8 voor een</text>
<text x="6" y="579.0" font-size="9" font-weight="400" fill="#6A655D" text-anchor="start">echt resultaat.</text></svg>