<text x="10" y="425.0" font-size="9.4" font-weight="400" fill="#6A655D" text-anchor="start">Lees: een stip betekent dat de code deze invoer daar gebruikt. Tijd en afstand zijn bewust geen harde filter: de duur</text>
<text x="10" y="437.0" font-size="9.4" font-weight="400" fill="#6A655D" text-anchor="start">in de bibliotheek is een gebruikelijke sessielengte, en de afstand stuurt het zoeken.</text>
<text x="10" y="461.0" font-size="9.4" font-weight="400" fill="#6A655D" text-anchor="start">'Alleen gecontroleerd' = de motor kan er niet op filteren (geen data in de bibliotheek) en geeft het door als</text>
<text x="10" y="473.0" font-size="9.4" font-weight="400" fill="#6A655D" text-anchor="start">controlevlag aan het zoeken en schrijven: toegankelijkheid, huisdieren, dieet, vervoer, weekend, avond, kosten dicht</text>
<text x="10" y="485.0" font-size="9.4" font-weight="400" fill="#6A655D" text-anchor="start">bij het budget.</text></svg>