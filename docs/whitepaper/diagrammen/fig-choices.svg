<svg style="font-family:'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 710" width="640" height="710" role="img" aria-label="Procesdiagram van de opeenvolgende keuzes en wat elke stap doorgeeft" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif"><defs>
<marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8C857A"/></marker>
<marker id="ah-s" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M10 0 L0 5 L10 10 z" fill="#8C857A"/></marker>
</defs><rect x="8" y="6" width="330" height="58" rx="7" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="16" y="23.4" font-size="10.4" font-weight="700" fill="#4A3611" text-anchor="start">Startpagina</text>
<text x="16" y="39.7" font-size="9.4" font-weight="400" fill="#4A3611" text-anchor="start">Voor wie, plaats, afstand en randvoorwaarden. Alleen de</text>
<text x="16" y="51.9" font-size="9.4" font-weight="400" fill="#4A3611" text-anchor="start">plaats is verplicht.</text>
<rect x="372" y="6" width="258" height="58" rx="7" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="380" y="22.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">Wordt bewaard als concept in de browser</text>
<text x="380" y="34.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">(sessionStorage).</text>
<line x1="338" y1="35" x2="372" y2="35" stroke="#B8B1A4" stroke-width="1.2" stroke-dasharray="2 3"/>
<path d="M173 64 L173 78" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="8" y="78" width="330" height="70" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="16" y="95.4" font-size="10.4" font-weight="700" fill="#33221A" text-anchor="start">Pagina 1: 18 beelden</text>
<text x="16" y="111.7" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">Eerste set: de context leunt de keuze (kind: spel en dieren,</text>
<text x="16" y="123.9" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">groep: samenwerken). Vier registers elk minstens 4, elke as</text>
<text x="16" y="136.1" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">aan beide kanten vertegenwoordigd.</text>
<rect x="372" y="78" width="258" height="70" rx="7" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="380" y="94.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">Per set: één variant per familie; families die</text>
<text x="380" y="106.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">je zag komen niet terug, tot de voorraad op is.</text>
<line x1="338" y1="113" x2="372" y2="113" stroke="#B8B1A4" stroke-width="1.2" stroke-dasharray="2 3"/>
<path d="M173 148 L173 162" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="8" y="162" width="330" height="70" rx="7" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="16" y="179.4" font-size="10.4" font-weight="700" fill="#4A3611" text-anchor="start">Je tikt beelden</text>
<text x="16" y="195.7" font-size="9.4" font-weight="400" fill="#4A3611" text-anchor="start">Minstens 3, hoogstens 8. 'Andere beelden' geeft een nieuwe</text>
<text x="16" y="207.9" font-size="9.4" font-weight="400" fill="#4A3611" text-anchor="start">set (max 3 keer): afwisselend dichtbij wat je koos en iets</text>
<text x="16" y="220.1" font-size="9.4" font-weight="400" fill="#4A3611" text-anchor="start">wat je nog niet koos.</text>
<rect x="372" y="162" width="258" height="52" rx="7" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="380" y="178.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">Gaat door: lijst kaart-id's (max 5 per ronde).</text>
<line x1="338" y1="188" x2="372" y2="188" stroke="#B8B1A4" stroke-width="1.2" stroke-dasharray="2 3"/>
<path d="M173 232 L173 246" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="8" y="246" width="330" height="72" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="16" y="263.4" font-size="10.4" font-weight="700" fill="#33221A" text-anchor="start">Smaakprofiel en dials</text>
<text x="16" y="279.7" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">Tag-profiel en vier assen worden direct in de browser</text>
<text x="16" y="291.9" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">uitgerekend. De twee dials volgen daaruit; de server bepaalt</text>
<text x="16" y="304.1" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">ze opnieuw bij het opslaan.</text>
<path d="M173 318 L173 332" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="8" y="332" width="330" height="56" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="16" y="349.4" font-size="10.4" font-weight="700" fill="#33221A" text-anchor="start">Pagina 2: 18 activiteiten</text>
<text x="16" y="365.7" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">Volgt de beelden. Drie plekken 'Misschien ook?' komen van</text>
<text x="16" y="377.9" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">ver, uit een ander register en een andere wereld.</text>
<rect x="372" y="332" width="258" height="40" rx="7" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="380" y="348.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">'Andere activiteiten' kan 3 keer; wat je koos</text>
<text x="380" y="360.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">blijft staan.</text>
<line x1="338" y1="352" x2="372" y2="352" stroke="#B8B1A4" stroke-width="1.2" stroke-dasharray="2 3"/>
<path d="M173 388 L173 402" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="8" y="402" width="330" height="58" rx="7" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="16" y="419.4" font-size="10.4" font-weight="700" fill="#4A3611" text-anchor="start">Je kiest activiteiten</text>
<text x="16" y="435.7" font-size="9.4" font-weight="400" fill="#4A3611" text-anchor="start">Minstens 1, hoogstens 8, of 'verras me'. Bij 1 of 2 keuzes</text>
<text x="16" y="447.9" font-size="9.4" font-weight="400" fill="#4A3611" text-anchor="start">vraagt de site om er meer.</text>
<rect x="372" y="402" width="258" height="52" rx="7" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="380" y="418.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">Gaat door: eigen keuzes (ankers). 'Verras me'</text>
<text x="380" y="430.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">laat de beelden alleen de dials sturen.</text>
<line x1="338" y1="428" x2="372" y2="428" stroke="#B8B1A4" stroke-width="1.2" stroke-dasharray="2 3"/>
<path d="M173 460 L173 474" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="8" y="474" width="330" height="70" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="16" y="491.4" font-size="10.4" font-weight="700" fill="#33221A" text-anchor="start">Profielscherm</text>
<text x="16" y="507.7" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">Je venster en een korte duiding. Je mag vier assen</text>
<text x="16" y="519.9" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">verschuiven en thema's toevoegen ('Niet helemaal'). Een</text>
<text x="16" y="532.1" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">schuif vervangt wat de beelden zeiden.</text>
<rect x="372" y="474" width="258" height="40" rx="7" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="380" y="490.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">Gaat door: axesOverride en correcties.</text>
<line x1="338" y1="494" x2="372" y2="494" stroke="#B8B1A4" stroke-width="1.2" stroke-dasharray="2 3"/>
<path d="M173 544 L173 558" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="8" y="558" width="330" height="58" rx="7" fill="#F8EFD9" stroke="#B08A4A" stroke-width="1.2"/>
<text x="16" y="575.4" font-size="10.4" font-weight="700" fill="#4A3611" text-anchor="start">Betalen</text>
<text x="16" y="591.7" font-size="9.4" font-weight="400" fill="#4A3611" text-anchor="start">E-mail, twee vinkjes (voorwaarden, directe levering),</text>
<text x="16" y="603.9" font-size="9.4" font-weight="400" fill="#4A3611" text-anchor="start">Stripe. Wijzigen kan tot dit moment.</text>
<path d="M173 616 L173 630" fill="none" stroke="#8C857A" stroke-width="1.4" marker-end="url(#ah)" stroke-linejoin="round"/>
<rect x="8" y="630" width="330" height="70" rx="7" fill="#EFE4DB" stroke="#5B3F2F" stroke-width="1.2"/>
<text x="16" y="647.4" font-size="10.4" font-weight="700" fill="#33221A" text-anchor="start">Server vertaalt eenmalig</text>
<text x="16" y="663.7" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">Saneert id's, rekent smaakprofiel en dials opnieuw uit,</text>
<text x="16" y="675.9" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">bouwt het publieksprofiel en bewaart alles als één record.</text>
<text x="16" y="688.1" font-size="9.4" font-weight="400" fill="#33221A" text-anchor="start">De motor leest alleen dit record.</text>
<rect x="372" y="630" width="258" height="52" rx="7" fill="#F7F5F0" stroke="#DED8CE" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="380" y="646.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">Wat de browser stuurt wordt niet vertrouwd:</text>
<text x="380" y="658.7" font-size="9.2" font-weight="400" fill="#202020" text-anchor="start">alles wordt opnieuw berekend.</text>
<line x1="338" y1="656" x2="372" y2="656" stroke="#B8B1A4" stroke-width="1.2" stroke-dasharray="2 3"/></svg>